name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Validate
        run: |
          version="${{ inputs.version }}"
          case "$version" in
            "" | *[!0-9.]*)
              echo "invalid version: $version" >&2
              exit 1
              ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
          node tests/skills/check-contracts.mjs

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$version" > VERSION
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "release v$version"
            git push origin HEAD:master
          fi
          git tag "v$version"
          git push origin "v$version"
          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"
