name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Validate
        run: |
          version="${{ inputs.version }}"
          case "$version" in
            "" | *[!0-9.]*)
              echo "invalid version: $version" >&2
              exit 1
              ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
          node tests/skills/check-contracts.mjs

      - name: Prepare release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "release/v$version" origin/master
          echo "$version" > VERSION
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "release v$version"
          fi
          git push -f origin "release/v$version"
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo "Release v$version. Merging publishes the tag and the release below."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "### Validation"
            echo
            echo "- [x] version format valid; tag v$version does not exist"
            echo "- [x] \`node tests/skills/check-contracts.mjs\` on this branch"
            echo "- CI below must pass before merge; it gates the merge via branch protection"
          } > "$RUNNER_TEMP/pr-body.md"
          num="$(gh pr list --head "release/v$version" --state open --json number --jq '.[0].number')"
          if [ -n "$num" ]; then
            gh pr edit "$num" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            num="$(gh pr create --base master --head "release/v$version" \
              --title "release v$version" --body-file "$RUNNER_TEMP/pr-body.md" \
              --json number --jq '.number')"
          fi
          echo "pr=$num" >> "$GITHUB_OUTPUT"

      - name: Merge, tag, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          num="${{ steps.pr.outputs.pr }}"
          gh pr checks "$num" --watch --fail-fast --interval 20
          gh pr merge "$num" --squash
          git fetch -q origin master
          git tag "v$version" origin/master
          git push origin "v$version"
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"
