name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Use latest gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh api repos/cli/cli/releases/latest --jq .tag_name)"
          curl -sSfL -o gh.tar.gz "https://github.com/cli/cli/releases/download/${tag}/gh_${tag#v}_linux_amd64.tar.gz"
          rm -rf "$RUNNER_TEMP/gh-cli" && mkdir -p "$RUNNER_TEMP/gh-cli"
          tar xzf gh.tar.gz -C "$RUNNER_TEMP/gh-cli"
          echo "$RUNNER_TEMP/gh-cli/gh_${tag#v}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: |
          version="$RELEASE_VERSION"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
          node tests/skills/check-contracts.mjs

      - name: Prepare release pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "release/v$version" origin/master
          echo "$version" > VERSION
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "release v$version"
          fi
          git push -f origin "release/v$version"
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo "Release v$version. Merging publishes the tag and the release below."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "### Validation"
            echo
            echo "- [x] version format valid; tag v$version does not exist"
            echo "- [x] \`node tests/skills/check-contracts.mjs\` on this branch"
            echo "- CI below must pass before merge; it gates the merge via branch protection"
          } > "$RUNNER_TEMP/pr-body.md"
          num="$(gh pr list --head "release/v$version" --state open --json number --jq '.[0].number')"
          if [ -n "$num" ]; then
            gh pr edit "$num" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base master --head "release/v$version" \
              --title "release v$version" --body-file "$RUNNER_TEMP/pr-body.md"
            num="$(gh pr list --head "release/v$version" --state open --json number --jq '.[0].number')"
          fi
          echo "pr=$num" >> "$GITHUB_OUTPUT"

      - name: Merge checked release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num="${{ steps.pr.outputs.pr }}"
          for _ in $(seq 1 40); do
            rollup="$(gh pr view "$num" --json statusCheckRollup --jq '.statusCheckRollup // []')"
            total="$(printf '%s' "$rollup" | jq 'length')"
            pending="$(printf '%s' "$rollup" | jq '[.[] | select(.status != "COMPLETED")] | length')"
            failed="$(printf '%s' "$rollup" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .conclusion == "CANCELLED" or .conclusion == "ACTION_REQUIRED")] | length')"
            if [ "$failed" != "0" ]; then
              echo "required checks failed" >&2
              exit 1
            fi
            if [ "$total" != "0" ] && [ "$pending" = "0" ]; then
              break
            fi
            sleep 30
          done
          if [ "$pending" != "0" ] || [ "$total" = "0" ]; then
            echo "checks did not complete in time" >&2
            exit 1
          fi
          gh pr merge "$num" --squash
          git fetch -q origin master
          merge_commit="$(gh pr view "$num" --json mergeCommit --jq .mergeCommit.oid)"
          git checkout --detach "$merge_commit"
          test "$(cat VERSION)" = "$RELEASE_VERSION"

      - name: Build and verify install assets from the merged release commit
        run: |
          assets="$RUNNER_TEMP/install-assets"
          node scripts/build-install-bundle.mjs "$assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          bundle="$(mktemp -d)"
          tar xzf "$assets/idea-to-production-v$RELEASE_VERSION.tar.gz" -C "$bundle"
          for scope in global repo; do
            target="$(mktemp -d)"
            home="$(mktemp -d)"
            HOME="$home" bash "$bundle/idea-to-production/install.sh" "$target" --skills-scope "$scope" --strict
            node tests/skills/check-contracts.mjs "$target"
          done

      - name: Tag and publish verified install assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$RELEASE_VERSION"
          git tag "v$version"
          git push origin "v$version"
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/install-assets/idea-to-production-v$version.tar.gz" \
            "$RUNNER_TEMP/install-assets/bootstrap.sh" "$RUNNER_TEMP/install-assets/SHA256SUMS"
