name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # Skill Watch uses pinned HTML/YAML parsers; other scripts remain stdlib-only.
      - name: Install script dependencies
        run: npm ci --ignore-scripts

      - name: Shell and script syntax
        run: |
          bash -n install.sh
          bash -n bootstrap.sh
          for f in scripts/*.mjs tests/skills/*.mjs; do node --check "$f"; done

      - name: Contract check
        run: node tests/skills/check-contracts.mjs

      - name: Script regression tests
        run: node --test tests/scripts/*.test.mjs

      - name: Lint workflows
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Cache skill clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/itp-cache
          key: itp-skills-${{ hashFiles('skills.lock.json') }}

      - name: Fresh install smoke
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/itp-cache
        run: |
          target="$(mktemp -d)"
          home="$(mktemp -d)"
          HOME="$home" bash install.sh --init "$target" --strict
          node tests/skills/check-contracts.mjs "$target"

      - name: Release bundle smoke (no client clones)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/itp-cache
        run: |
          assets="$RUNNER_TEMP/install-assets"
          node scripts/build-install-bundle.mjs "$assets"
          (cd "$assets" && sha256sum -c SHA256SUMS)
          bundle="$(mktemp -d)"
          tar xzf "$assets/idea-to-production-v$(cat VERSION).tar.gz" -C "$bundle"
          for scope in global repo; do
            target="$(mktemp -d)"
            home="$(mktemp -d)"
            HOME="$home" bash "$bundle/idea-to-production/install.sh" "$target" --skills-scope "$scope" --checkpoints phase --strict
            node tests/skills/check-contracts.mjs "$target"
          done
