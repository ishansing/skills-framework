    <path d="M 1034 202 L 1132 202 L 1158 228 L 1158 352 L 1034 352 Z" fill="#F3F0E5" stroke="#20201D" stroke-width="1.5" />
    <polygon points="1132,202 1132,228 1158,228" fill="#C9C6BB" stroke="#20201D" stroke-width="1.2" />
