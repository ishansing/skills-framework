    <path d="M 1132 482 L 1146 496 L 1176 466" fill="none" stroke="#20201D" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" />
    <line x1="1195" y1="560" x2="1245" y2="560" stroke="#20201D" stroke-width="1.2" />
    <line x1="1220" y1="525" x2="1220" y2="560" stroke="#20201D" stroke-width="1" />
  </g>

