    <line x1="1078" y1="274" x2="1122" y2="274" stroke="#20201D" stroke-width="1.2" />
    <circle cx="1058" cy="296" r="8" fill="none" stroke="#20201D" stroke-width="1.5" />
    <line x1="1078" y1="292" x2="1138" y2="292" stroke="#20201D" stroke-width="1.2" />
    <line x1="1078" y1="298" x2="1138" y2="298" stroke="#20201D" stroke-width="1.2" />
    <line x1="1078" y1="304" x2="1110" y2="304" stroke="#20201D" stroke-width="1.2" />
    <circle cx="1058" cy="326" r="8" fill="#C9C6BB" stroke="#20201D" stroke-width="1.5" />
    <line x1="1078" y1="320" x2="1108" y2="320" stroke="#20201D" stroke-width="1.2" />
    <line x1="1078" y1="326" x2="1108" y2="326" stroke="#20201D" stroke-width="1.2" />
    <line x1="1078" y1="332" x2="1108" y2="332" stroke="#20201D" stroke-width="1.2" />
    <rect x="1116" y="316" width="32" height="24" fill="url(#crosshatch)" />
    <rect x="1064" y="352" width="18" height="22" fill="#C9C6BB" stroke="#20201D" stroke-width="1.2" />
    <line x1="1225" y1="172" x2="1225" y2="310" stroke="#20201D" stroke-width="1" />
    <line x1="1218" y1="224" x2="1232" y2="224" stroke="#20201D" stroke-width="1" />
    <line x1="1218" y1="292" x2="1232" y2="292" stroke="#20201D" stroke-width="1" />
    <circle cx="1225" cy="348" r="12" fill="none" stroke="#20201D" stroke-width="1.2" />
    <line x1="1205" y1="348" x2="1245" y2="348" stroke="#20201D" stroke-width="1" />
    <line x1="1225" y1="328" x2="1225" y2="368" stroke="#20201D" stroke-width="1" />
  </g>

  <!-- STAGE 3: BUILD -->
  <g id="stage-build">
    <rect x="876" y="408" width="42" height="42" fill="url(#hatch)" stroke="#20201D" stroke-width="1.2" />
    <rect x="944" y="378" width="36" height="36" fill="#20201D" />
    <circle cx="962" cy="396" r="1.5" fill="#F3F0E5" />
    <rect x="926" y="432" width="18" height="36" fill="#20201D" />
    <rect x="876" y="468" width="40" height="42" fill="#F3F0E5" stroke="#20201D" stroke-width="1.2" />
    <line x1="876" y1="468" x2="916" y2="510" stroke="#20201D" stroke-width="0.9" />
    <line x1="916" y1="468" x2="876" y2="510" stroke="#20201D" stroke-width="0.9" />
    <rect x="916" y="468" width="28" height="36" fill="#20201D" />
    <circle cx="930" cy="486" r="10" fill="#F3F0E5" />
    <g fill="#20201D">
      <circle cx="962" cy="492" r="2" /> <circle cx="970" cy="492" r="2" /> <circle cx="978" cy="492" r="2" /> <circle cx="986" cy="492" r="2" />
      <circle cx="962" cy="500" r="2" /> <circle cx="970" cy="500" r="2" /> <circle cx="978" cy="500" r="2" /> <circle cx="986" cy="500" r="2" />
      <circle cx="962" cy="508" r="2" /> <circle cx="970" cy="508" r="2" /> <circle cx="978" cy="508" r="2" /> <circle cx="986" cy="508" r="2" />
      <circle cx="962" cy="516" r="2" /> <circle cx="970" cy="516" r="2" /> <circle cx="978" cy="516" r="2" /> <circle cx="986" cy="516" r="2" />
      <circle cx="962" cy="524" r="2" /> <circle cx="970" cy="524" r="2" /> <circle cx="978" cy="524" r="2" /> <circle cx="986" cy="524" r="2" />
    </g>
    <line x1="885" y1="305" x2="885" y2="395" stroke="#20201D" stroke-width="0.9" />
    <circle cx="885" cy="305" r="3" fill="#20201D" />
    <line x1="830" y1="450" x2="830" y2="495" stroke="#20201D" stroke-width="1" />
