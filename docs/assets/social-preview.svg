    <circle cx="1152" cy="482" r="52" fill="none" stroke="#20201D" stroke-width="1.2" stroke-dasharray="2,2" />
    <circle cx="1152" cy="482" r="38" fill="none" stroke="#20201D" stroke-width="1.2" />
