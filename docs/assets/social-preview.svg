    <line x1="915" y1="122" x2="935" y2="175" stroke="#20201D" stroke-width="0.75" />
    <line x1="912" y1="215" x2="935" y2="175" stroke="#20201D" stroke-width="0.75" />
    <line x1="835" y1="225" x2="875" y2="242" stroke="#20201D" stroke-width="0.75" />
    <line x1="850" y1="162" x2="885" y2="175" stroke="#20201D" stroke-width="0.75" />
    <circle cx="885" cy="175" r="14" fill="#20201D" />
    <circle cx="835" cy="112" r="6.5" fill="#20201D" />
    <circle cx="835" cy="225" r="6.5" fill="#20201D" />
    <circle cx="915" cy="122" r="5" fill="#20201D" />
    <circle cx="912" cy="215" r="6.5" fill="#20201D" />
    <circle cx="935" cy="175" r="4.5" fill="#20201D" />
    <circle cx="850" cy="162" r="3.5" fill="#20201D" />
    <circle cx="875" cy="242" r="3.5" fill="#20201D" />
    <circle cx="885" cy="257" r="3.5" fill="#20201D" />
    <circle cx="956" cy="175" r="4.5" fill="#20201D" />
    <line x1="935" y1="212" x2="995" y2="212" stroke="#20201D" stroke-width="1.2" marker-end="url(#arrow-black)" />
  </g>

  <!-- STAGE 2: SPECIFY -->
  <g id="stage-specify">
    <line x1="990" y1="96" x2="1062" y2="96" stroke="#20201D" stroke-width="1" />
    <line x1="1062" y1="96" x2="1062" y2="162" stroke="#20201D" stroke-width="1" />
    <line x1="1012" y1="162" x2="1114" y2="162" stroke="#20201D" stroke-width="1" />
